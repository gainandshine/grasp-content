<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grasp Visualizer Studio (Mobile Studio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="mobile-templates.js"></script>
  
  <style>
    :root {
      --bg: #121316;
      --surface: #1E1F24;
      --surface-border: #2A2C34;
      --accent: #FF5733;
      --accent-hover: #E04824;
      --teal: #1D9E75;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --canvas-bg: #F5F0E8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1.5px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }
    .brand-badge {
      background: var(--accent);
      color: #FFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: var(--surface-border);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #353842; }
    .btn-primary { background: var(--accent); color: #FFF; border: none; }
    .btn-primary:hover { background: var(--accent-hover); }

    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 320px;
      background: var(--surface);
      border-right: 1.5px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }
    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--surface-border);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      height: calc(100vh - 120px);
    }
    .course-item { margin-bottom: 16px; }
    .course-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .topic-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .topic-btn:hover { background: var(--surface-border); }
    .topic-btn.active {
      background: rgba(255, 87, 51, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--surface-border);
      color: var(--text-muted);
    }
    .pill.has-viz { background: rgba(29, 158, 117, 0.2); color: var(--teal); }

    /* Center Stage Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0A0A0C;
      position: relative;
      overflow: hidden;
    }
    .workspace-header {
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .viz-title { font-size: 15px; font-weight: 600; }

    .canvas-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-y: auto;
    }

    /* Modern Phone Mockup Card */
    .device-mockup {
      width: 390px;
      height: 680px;
      background: #1C1C1E;
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 12px #2C2C2E, 0 0 0 14px #1C1C1E;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* iPhone Notch & Status Bar */
    .mockup-notch {
      width: 140px;
      height: 24px;
      background: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mockup-camera {
      width: 10px;
      height: 10px;
      background: #111;
      border-radius: 50%;
      border: 1px solid #222;
    }

    /* Inner Screen Container */
    .mockup-screen {
      flex: 1;
      margin-top: 24px;
      background: var(--canvas-bg);
      position: relative;
      overflow: hidden;
    }

    iframe#mobileFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #F5F0E8;
      overflow-y: auto;
    }

    /* Right Code Editor */
    .editor-panel {
      width: 480px;
      background: var(--surface);
      border-left: 1.5px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .editor-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .editor-area {
      flex: 1;
      background: #0E0F12;
      color: #E5E7EB;
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 14px;
      border: none;
      outline: none;
      resize: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--teal);
      color: #FFF;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>📱 Grasp Visualizer Studio</span>
      <span class="brand-badge">Mobile Mockup</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="loadCourses()">🔄 Refresh Content</button>
      <button class="btn btn-primary" onclick="saveCurrentViz()">💾 Save Changes</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Navigation -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search topic or course..." oninput="filterTopics()">
      </div>
      <div class="nav-list" id="navList">
        <div style="padding: 20px; text-align: center; color: var(--text-muted);">Loading courses...</div>
      </div>
    </div>

    <!-- Center Stage Workspace -->
    <div class="workspace">
      <div class="workspace-header">
        <div class="viz-title" id="currentVizTitle">Select a topic to preview in mobile mockup</div>
        <button class="btn" onclick="runViz()">🔄 Reload WebView</button>
      </div>

      <div class="canvas-stage">
        <!-- Phone Mockup Container -->
        <div class="device-mockup">
          <div class="mockup-notch"><div class="mockup-camera"></div></div>
          <div class="mockup-screen">
            <iframe id="mobileFrame"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Right JSON & Code Editor -->
    <div class="editor-panel">
      <div class="editor-header">
        <span>visualizations.json</span>
        <label style="font-weight: 400; font-size: 12px; display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="autoReloadCheck" checked> Live Reload
        </label>
      </div>
      <textarea id="jsonEditor" class="editor-area" spellcheck="false" placeholder="Select a visualization to edit..."></textarea>
    </div>
  </div>

  <div class="toast" id="toast">Saved to disk!</div>

  <script>
    let coursesData = [];
    let currentTopic = null;

    const frame = document.getElementById('mobileFrame');
    const jsonEditor = document.getElementById('jsonEditor');

    async function loadCourses() {
      try {
        const res = await fetch('/api/courses');
        coursesData = await res.json();
        renderNav();
      } catch (err) {
        document.getElementById('navList').innerHTML = `<div style="padding: 20px; color: #F87171;">Failed to load courses</div>`;
      }
    }

    function renderNav(query = '') {
      const nav = document.getElementById('navList');
      nav.innerHTML = '';

      const q = query.toLowerCase().trim();

      coursesData.forEach(course => {
        let hasMatchInCourse = false;
        const cDiv = document.createElement('div');
        cDiv.className = 'course-item';
        cDiv.innerHTML = `<div class="course-title">${course.name}</div>`;

        course.chapters.forEach(ch => {
          ch.topics.forEach(topic => {
            if (q && !topic.name.toLowerCase().includes(q) && !course.name.toLowerCase().includes(q)) {
              return;
            }
            hasMatchInCourse = true;

            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            if (currentTopic && currentTopic.path === topic.path) {
              btn.classList.add('active');
            }
            btn.innerHTML = `
              <span>${topic.name}</span>
              <span class="pill ${topic.hasViz ? 'has-viz' : ''}">${topic.hasViz ? 'Viz Ready' : 'No Viz'}</span>
            `;
            btn.onclick = () => selectTopic(topic, btn);
            cDiv.appendChild(btn);
          });
        });

        if (hasMatchInCourse) {
          nav.appendChild(cDiv);
        }
      });

      if (nav.children.length === 0) {
        nav.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted);">No matching topics found</div>`;
      }
    }

    function filterTopics() {
      const q = document.getElementById('searchInput').value;
      renderNav(q);
    }

    function selectTopic(topic, btnEl) {
      document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      currentTopic = topic;
      document.getElementById('currentVizTitle').textContent = topic.name;

      const vizObj = topic.vizData || { visualizations: [] };
      jsonEditor.value = JSON.stringify(vizObj, null, 2);

      runViz();
    }

    function runViz() {
      try {
        const jsonText = jsonEditor.value;
        const parsed = JSON.parse(jsonText);
        const viz = (parsed.visualizations && parsed.visualizations[0]) || parsed;
        const type = viz.type || '2d-anim';

        let html = '';
        if (type === 'simulation') {
          html = generateSimulationHtml(viz);
        } else {
          html = generate2dAnimHtml(viz);
        }

        frame.srcdoc = html;
      } catch (e) {
        frame.srcdoc = `<html><body style="background:#3B1619;color:#FCA5A5;padding:16px;font-family:sans-serif;"><h3>JSON Error</h3><pre>${e.message}</pre></body></html>`;
      }
    }

    jsonEditor.addEventListener('input', () => {
      if (document.getElementById('autoReloadCheck').checked) {
        runViz();
      }
    });

    async function saveCurrentViz() {
      if (!currentTopic || !currentTopic.path) {
        alert('No topic selected!');
        return;
      }

      try {
        const vizData = JSON.parse(jsonEditor.value);
        const res = await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetPath: currentTopic.path, vizData }),
        });

        const result = await res.json();
        if (result.success) {
          showToast('Saved to disk successfully!');
        } else {
          alert('Save failed: ' + result.error);
        }
      } catch (err) {
        alert('Invalid JSON or save error: ' + err.message);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    loadCourses();
  </script>
</body>
</html>
